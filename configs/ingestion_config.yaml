ingestion:
  aqi_provider: "openaq"  # live by default; mock is opt-in for tests only
  weather_provider: "open_meteo"  # options: "mock", "open_meteo"
  poll_interval_minutes: 15
  timeout_seconds: 30
  retry_attempts: 3
  retry_backoff_seconds: 5

storage:
  raw_aqi_dir: "data/raw/aqi"
  raw_weather_dir: "data/raw/weather"
  processed_dir: "data/processed"
  features_dir: "data/features"
  partition_format: "%Y/%m/%d"

openaq:
  base_url: "https://api.openaq.org/v3"
  country: "IN"
  city: "Delhi"
  limit: 100

open_meteo:
  historical_url: "https://archive-api.open-meteo.com/v1/archive"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  hourly_parameters:
    - "temperature_2m"
    - "relative_humidity_2m"
    - "dew_point_2m"
    - "surface_pressure"
    - "wind_speed_10m"
    - "wind_direction_10m"
    - "wind_gusts_10m"
    - "boundary_layer_height"
    - "precipitation"
