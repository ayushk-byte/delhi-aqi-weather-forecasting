name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (libgomp for LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run Ruff Linting
        run: |
          ruff check src tests ui

      - name: Run Ruff Format Check
        run: |
          ruff format --check src tests ui

      - name: Run Pytest Test Suite
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Verify Training & Inference CLI Execution
        run: |
          python -m src.pipelines.training_pipeline --pollutant pm25
          python -m src.pipelines.inference_pipeline
          python -m src.pipelines.worker --run-once
